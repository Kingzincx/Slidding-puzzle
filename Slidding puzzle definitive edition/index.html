<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sliding Puzzle Game</title>
    <!-- CSS File Includes -->
    <link rel="stylesheet" href="styles/general.css" />
    <link rel="stylesheet" href="styles/background.css" />
    <link rel="stylesheet" href="styles/menu.css" />
    <link rel="stylesheet" href="styles/buttons.css" />
    <link rel="stylesheet" href="styles/form.css" />
    <link rel="stylesheet" href="styles/gameplay.css" />
    <link rel="stylesheet" href="styles/tiles.css" />
    <link rel="stylesheet" href="styles/pause.css" />
    <link rel="stylesheet" href="styles/victory.css" />
    <link rel="stylesheet" href="styles/audio_settings.css" />
    <link rel="stylesheet" href="styles/user_circle.css" />
  </head>
  <body>
    <!-- Background GIF -->
    <div id="background-gif"></div>

    <!-- User Circle -->
    <div id="user-circle-container">
      <div id="user-circle-ripple"></div>
      <div id="user-circle" onclick="toggleUserMenu()">
        <span id="user-circle-text">?</span>
      </div>
      <div id="user-dropdown" style="display: none">
        <!-- Dynamic content via updateUserCircle() -->
      </div>
    </div>

    <!-- Background Music -->
    <audio id="game-music" loop>
      <source src="audios/default_music.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>

    <!-- Game Sections -->
    <!-- Main Menu -->
    <div id="main-menu" class="menu">
      <h1>Sliding Puzzle Game</h1>
      <button onclick="showSection('modeSelect')">Play</button>
      <button onclick="showSection('options')">Options</button>
      <button onclick="exitGame()">Exit</button>
    </div>

    <!-- Select Game Mode -->
    <div id="modeSelect" class="menu" style="display: none">
      <h1>Select Game Mode</h1>
      <button onclick="selectDifficulty('classic')">Classic Mode</button>
      <button onclick="startGame('zen')">Zen Mode</button>
      <button onclick="selectDifficulty('timed')">Time Attack Mode</button>
      <button onclick="showSection('main-menu')">Back</button>
    </div>

    <!-- Select Difficulty -->
    <div id="difficultySelect" class="menu" style="display: none">
      <h1>Select Difficulty</h1>
      <button onclick="startGame(currentMode, 'easy')">Easy (3x3)</button>
      <button onclick="startGame(currentMode, 'hard')">Hard (6x6)</button>
      <button onclick="showSection('modeSelect')">Back</button>
    </div>

    <!-- Login -->
    <div id="login" class="form-container" style="display: none">
      <h1>Login</h1>
      <input
        type="text"
        id="login-username"
        placeholder="Username"
        required
      />
      <input
        type="password"
        id="login-password"
        placeholder="Password"
        required
      />
      <button onclick="login()">Sign In</button>
      <button onclick="showSection('main-menu')">Back</button>
    </div>

    <!-- Register -->
    <div id="register" class="form-container" style="display: none">
      <h1>Register</h1>
      <input
        type="text"
        id="register-username"
        placeholder="Username"
        required
      />
      <input
        type="password"
        id="register-password"
        placeholder="Password"
        required
      />
      <button onclick="register()">Register</button>
      <button onclick="showSection('main-menu')">Back</button>
    </div>

    <!-- Leaderboard -->
    <div id="ranking" class="ranking-container" style="display: none">
      <h1>Ranking</h1>
      <div id="rankingTable">
        <!-- The leaderboard will be loaded here -->
      </div>
      <button onclick="showSection('main-menu')">Back</button>
    </div>

    <!-- Options -->
    <div id="options" class="menu" style="display: none">
      <h1>Options</h1>
      <h2>Change Theme</h2>
      <button onclick="changeTheme('default')">Default</button>
      <button onclick="changeTheme('anime')">Anime</button>
      <button onclick="changeTheme('highschool')">Highschool</button>

      <!-- Audio Settings -->
      <h2>Audio Settings</h2>
      <label for="music-volume">Music Volume</label>
      <input type="range" id="music-volume" min="0" max="100" value="80" />

      <!-- Clear Local Storage -->
      <h2>Other Options</h2>
      <button onclick="clearLocalStorage()">Clear Data</button>

      <button onclick="showSection('main-menu')">Back</button>
    </div>

    <!-- Gameplay -->
    <div id="game-container" class="game-container" style="display: none">
      <div class="countdown" id="countdown">3</div>
      <div class="game" id="game">
        <!-- Puzzle tiles will be generated here -->
      </div>
      <div class="scoreboard">
        <div id="timer-container">Time: <span id="timer">00:00</span></div>
        <div id="score-container">Score: <span id="score">1000</span></div>
      </div>
      <button id="pauseBtn" onclick="togglePause()">Pause (P)</button>
      <button id="solve-button" onclick="autoSolve()">Auto-Solve</button>
    </div>

    <!-- Pause Menu -->
    <div class="pause-menu" id="pauseMenu" style="display: none">
      <h2>Game Paused</h2>
      <button onclick="resumeGame()">Resume</button>
      <button onclick="exitToMenu()">Back to Menu</button>
    </div>

    <!-- Victory Screen -->
    <div class="victory-screen" id="victoryScreen" style="display: none">
      <h2 id="victoryMessage">Congratulations! You solved the puzzle.</h2>
      <p id="victoryStats"></p>
      <button onclick="restartGame()">Play Again</button>
      <button onclick="exitToMenu()">Back to Menu</button>
    </div>

    <!-- Victory Music -->
    <audio id="victory-music">
      <!-- Source is defined dynamically in the script -->
    </audio>

    <!-- Scripts -->
    <script src="srcs/main.js"></script>
    <script src="srcs/user.js"></script>
    <script src="srcs/solve/audio_score.js"></script>
    <script src="srcs/game_setup.js"></script>
    <script src="srcs/puzzle.js"></script>
    <script src="srcs/game_play.js"></script>
    <script src="srcs/utilities.js"></script>
    <script src="srcs/solve/min_heap.js"></script>
    <script src="srcs/solve/state_codec.js"></script>
    <script src="srcs/solve/heuristics.js"></script>
    <script src="srcs/solve/solver_3x3.js"></script>
    <script src="srcs/solve/solver_6x6.js"></script>
    <script src="srcs/solve/auto_solve_runtime.js"></script>
    <script src="srcs/beat_sync.js"></script>
  </body>
</html>
